name: Manual Local Crawlers - TopCV, JobsGO, Vieclam24h, Timviec365 (Self-Hosted Runner)

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Tên spider cần chạy trên máy local (mặc định: topcv,jobsgo,vieclam24h,timviec365)'
        required: false
        default: 'topcv,jobsgo,vieclam24h,timviec365'
      pages:
        description: 'Số lượng trang muốn cào cho mỗi website (mặc định: 10)'
        required: false
        default: '10'
      jobs_per_page:
        description: 'Số lượng job mỗi trang (nhập số hoặc "max")'
        required: false
        default: 'max'
      dedup_threshold:
        description: 'Ngưỡng tương quan khử trùng lặp (mặc định: 0.90)'
        required: false
        default: '0.90'
      workers:
        description: 'Số luồng crawler chạy song song (mặc định: 2)'
        required: false
        default: '2'

concurrency:
  group: local-topcv-jobsgo-crawler
  cancel-in-progress: false

jobs:
  crawl_local:
    name: Crawl TopCV & JobsGO on Local Machine (Vietnam IP)
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: 🌐 Install Playwright Chromium (if needed)
        run: |
          playwright install chromium

      - name: 🔌 Verify Supabase Connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
        run: |
          python -c "from crawler.db import ensure_table_exists; ensure_table_exists('all_jobs_unified'); print('✅ Kết nối Supabase PostgreSQL thành công!')"

      - name: 🚀 Run TopCV & JobsGO Crawlers (Local Vietnam IP)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          SITES="${{ inputs.sites }}"
          if [ -z "$SITES" ]; then
            SITES="topcv,jobsgo,vieclam24h,timviec365"
          fi
          CMD="python crawler/main.py --site $SITES"
          if [ -n "${{ inputs.pages }}" ]; then
            CMD="$CMD --pages ${{ inputs.pages }}"
          else
            CMD="$CMD --pages 10"
          fi
          if [ -n "${{ inputs.jobs_per_page }}" ]; then
            CMD="$CMD --jobs-per-page ${{ inputs.jobs_per_page }}"
          fi
          if [ -n "${{ inputs.dedup_threshold }}" ]; then
            CMD="$CMD --dedup-threshold ${{ inputs.dedup_threshold }}"
          fi
          if [ -n "${{ inputs.workers }}" ]; then
            CMD="$CMD --workers ${{ inputs.workers }}"
          fi
          echo "Executing on Local Self-Hosted Runner: $CMD"
          eval $CMD

      - name: 📊 Render GitHub Step Summary
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
        shell: bash
        run: |
          python -c "
          import os
          from crawler.db import get_db_connection

          summary_file = os.getenv('GITHUB_STEP_SUMMARY')
          if not summary_file:
              exit(0)

          with open(summary_file, 'a', encoding='utf-8') as f:
              f.write('## 📊 Báo Cáo Kết Quả TopCV & JobsGO (Chạy trên Local Runner)\n\n')
              f.write('| Tên Bảng (Source / Unified) | Số Lượng Bản Ghi |\n')
              f.write('| :--- | :--- |\n')
              try:
                  with get_db_connection() as conn:
                      with conn.cursor() as cur:
                          for s in ['topcv', 'jobsgo']:
                              try:
                                  cur.execute(f'SELECT COUNT(*) FROM jobs_{s};')
                                  cnt = cur.fetchone()[0]
                                  f.write(f'| `jobs_{s}` | **{cnt}** |\n')
                              except Exception:
                                  f.write(f'| `jobs_{s}` | *Chưa tạo* |\n')
                          cur.execute('SELECT COUNT(*) FROM all_jobs_unified;')
                          f.write(f'| **🌟 `all_jobs_unified` (Bảng Tổng)** | **{cur.fetchone()[0]}** |\n')
              except Exception as e:
                  f.write(f'\n> ⚠️ Lỗi truy vấn: {e}\n')
          "

      - name: 📱 Optional: Notify Telegram on Finish
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="🤖 *[Job Hunter Local Pipeline - TopCV & JobsGO]* Kết quả chạy: *$JOB_STATUS*%0A⏰ Thời gian: $(date '+%Y-%m-%d %H:%M:%S') UTC%0A🔗 Chi tiết: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown" > /dev/null || true
          fi
