name: Test New Crawlers (TopDev, TimViec365, Job123)

on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Danh sách spider mới cần test (ngăn cách bởi dấu phẩy)'
        required: false
        default: 'topdev,timviec365,job123'
      pages:
        description: 'Số trang muốn cào cho mỗi website (test nhanh: 1)'
        required: false
        default: '1'
      jobs_per_page:
        description: 'Số lượng job mỗi trang (test nhanh: 3, hoặc "max")'
        required: false
        default: '3'
      workers:
        description: 'Số luồng chạy song song (mặc định: 3)'
        required: false
        default: '3'
      skip_sync:
        description: 'Chỉ cào kiểm tra bảng nguồn, bỏ qua đồng bộ all_jobs_unified'
        type: boolean
        required: false
        default: false

concurrency:
  group: test-new-crawlers
  cancel-in-progress: false

jobs:
  test_crawlers:
    name: Test Crawlers & Sync
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: 🌐 Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: 🔌 Verify Supabase Connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
        run: |
          python -c "
          from crawler.db import ensure_table_exists
          ensure_table_exists('all_jobs_unified')
          print('✅ Kết nối Supabase PostgreSQL thành công!')
          "

      - name: 🚀 Run Test Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PYTHONUNBUFFERED: "1"
        run: |
          CMD="python crawler/main.py --site ${{ inputs.sites }} --pages ${{ inputs.pages }} --jobs-per-page ${{ inputs.jobs_per_page }} --workers ${{ inputs.workers }}"
          
          if [ "${{ inputs.skip_sync }}" = "true" ]; then
            CMD="$CMD --skip-sync"
          fi

          echo "Thực thi lệnh: $CMD"
          eval $CMD
