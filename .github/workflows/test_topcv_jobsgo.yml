name: Test TopCV & JobsGO Bypass on Cloud

on:
  push:
    paths:
      - 'crawler/crawl/topcv.py'
      - 'crawler/crawl/jobsgo.py'
      - 'crawler/utils/browser_solver.py'
      - '.github/workflows/test_topcv_jobsgo.yml'
  workflow_dispatch:

jobs:
  test_bypass:
    name: Test TopCV and JobsGO Bypass
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: 🌐 Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: 🧪 Run TopCV & JobsGO Test under Xvfb
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🚀 Bắt đầu kiểm thử vượt Cloudflare cho TopCV & JobsGO trên Cloud..."
          xvfb-run -a python crawler/main.py --site topcv,jobsgo --pages 1 --jobs-per-page 2
