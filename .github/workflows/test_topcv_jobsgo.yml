name: Test TopCV & JobsGO Bypass on Cloud

on:
  push:
    paths:
      - 'crawler/crawl/topcv.py'
      - 'crawler/crawl/jobsgo.py'
      - 'crawler/utils/browser_solver.py'
      - '.github/workflows/test_topcv_jobsgo.yml'
  workflow_dispatch:

jobs:
  test_bypass:
    name: Test TopCV and JobsGO Bypass
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: 🌐 Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: 🧪 Run TopCV & JobsGO Test under Xvfb
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🚀 Bắt đầu kiểm thử vượt Cloudflare cho TopCV & JobsGO trên Cloud..."
          set -o pipefail
          xvfb-run -a python crawler/main.py --site topcv,jobsgo --pages 1 --jobs-per-page 5 2>&1 | tee test_run.log

      - name: 📦 Upload Test Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-log
          path: test_run.log

      - name: 📱 Send Cloud Test Summary to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, httpx
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          if token and chat_id and os.path.exists('test_run.log'):
              with open('test_run.log', 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              content = ''.join(lines[-35:])
              msg = f'🧪 <b>[GitHub Actions Cloud Test Report]</b>\n<pre>{content[:3800]}</pre>'
              try:
                  httpx.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
              except Exception as e:
                  print('Telegram send err:', e)
          "

      - name: 📋 Render Test Log to Summary
        if: always()
        run: |
          echo "## 📋 Kết Quả Test TopCV & JobsGO Trên Cloud" >> $GITHUB_STEP_SUMMARY
          if [ -f test_run.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
